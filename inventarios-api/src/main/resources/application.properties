spring.application.name=inventarios

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configurar el patrón del log
logging.pattern.console=[%thread] %-5level: %logger - %msg%n

# Confirmar el nivel del log
logging.level.root=INFO

spring.main.banner-mode=off